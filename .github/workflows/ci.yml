name: Swift and StoreKit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Standalone package tests
        run: swift test
      - name: Build Mac example
        run: >-
          xcodebuild -project Examples/TipJarDemo/TipJarDemo.xcodeproj
          -scheme TipJarDemo-macOS -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
  storekit:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/optional-tips-devices.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/optional-tips-devices.json') as stream:
              runtimes = json.load(stream)['devices']
          phones = [device for runtime, devices in runtimes.items() if '.iOS-' in runtime
                    for device in devices if device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('TIP_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Boot simulator before test launch
        run: |
          xcrun simctl boot "$TIP_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$TIP_SIMULATOR_ID" -b
      - name: Signed local StoreKit tests
        run: >-
          xcodebuild -project Examples/TipJarDemo/TipJarDemo.xcodeproj
          -scheme TipJarDemo-iOS
          -destination "platform=iOS Simulator,id=$TIP_SIMULATOR_ID"
          CODE_SIGN_IDENTITY=- -collect-test-diagnostics never test
